<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inicio de Sesión</title>

    <!-- Archivo CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Contenedor principal -->
    <main class="contenedor">

        <!-- Título -->
        <div class="titulo">
            Inicio de Sesion
        </div>


        <!-- Formulario -->
        <section class="formulario">

            <!-- Email -->
            <div class="campo">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Value"
                >

            </div>


            <!-- Password -->
            <div class="campo">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Value"
                >

            </div>


            <!-- Botón -->
            <button
                id="btnLogin"
                class="boton-login"
            >
                Sign In ♙
            </button>


            <!-- Recuperar contraseña -->
            <a
                href="#"
                class="forgot"
            >
                Forgot password?
            </a>


            <!-- Iconos -->
            <div class="iconos">

                <div class="icono">
                    ☆
                </div>

                <div class="icono activo">
                    ▦
                </div>

                <div class="icono">
                    ★
                </div>

                <div class="icono">
                    ★
                </div>

            </div>

        </section>


        <!-- Imagen -->
        <section class="imagen-container">

            <img
                src="imagenes/imagen_prueba.png"
                alt="Imagen de inicio de sesión"
                class="imagen-login"
            >

        </section>

    </main>


    <!-- Archivo JavaScript -->
    <script src="script.js"></script>

</body>

</html>
