<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inicio de Sesión</title>

    <!-- Archivo de estilos -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Contenedor principal -->
    <main class="contenedor">


        <!-- ================================= -->
        <!-- TÍTULO                            -->
        <!-- ================================= -->

        <div class="titulo">
            Inicio de Sesion
        </div>


        <!-- ================================= -->
        <!-- FORMULARIO                        -->
        <!-- ================================= -->

        <section class="formulario">


            <!-- Email -->
            <div class="campo">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Value"
                >

            </div>


            <!-- Password -->
            <div class="campo">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Value"
                >

            </div>


            <!-- ================================= -->
            <!-- BOTÓN INICIAR SESIÓN              -->
            <!-- ================================= -->

            <button
                id="btnLogin"
                class="boton-login"
            >
                Sign In
                <span class="icono-usuario">♙</span>
            </button>


            <!-- ================================= -->
            <!-- RECUPERAR CONTRASEÑA               -->
            <!-- ================================= -->

            <a
                href="#"
                id="forgotPassword"
                class="forgot"
            >
                Forgot password?
            </a>


            <!-- ================================= -->
            <!-- SEPARADOR                         -->
            <!-- ================================= -->

            <div class="separador">

                <span></span>

                <p>O continuar con</p>

                <span></span>

            </div>


            <!-- ================================= -->
            <!-- INICIO DE SESIÓN SOCIAL            -->
            <!-- ================================= -->

            <div class="botones-sociales">


                <!-- GOOGLE -->
                <button
                    class="boton-social"
                    id="btnGoogle"
                >

                    <div class="logo-google">
                        G
                    </div>

                    <span>
                        Google
                    </span>

                </button>


                <!-- MICROSOFT -->
                <button
                    class="boton-social"
                    id="btnMicrosoft"
                >

                    <div class="logo-microsoft">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                    <span>
                        Microsoft
                    </span>

                </button>


                <!-- APPLE -->
                <button
                    class="boton-social"
                    id="btnApple"
                >

                    <div class="logo-apple">
                        ●
                    </div>

                    <span>
                        Apple
                    </span>

                </button>


            </div>


            <!-- ================================= -->
            <!-- REGISTRO                           -->
            <!-- ================================= -->

            <div class="registro">

                <span>
                    ¿No tienes cuenta?
                </span>

                <a
                    href="#"
                    id="btnRegistro"
                >
                    Regístrate
                </a>

            </div>


        </section>


        <!-- ================================= -->
        <!-- IMAGEN DERECHA                    -->
        <!-- ================================= -->

        <section class="imagen-container">

            <img
                src="imagenes/imagen_prueba.png"
                alt="Imagen de inicio de sesión"
                class="imagen-login"
            >

        </section>


    </main>


    <!-- Archivo JavaScript -->
    <script src="script.js"></script>

</body>

</html>
