<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crear cuenta</title>
        <link rel="stylesheet" href="registro.css">
    </head>
    <body>
        <main class="registro-container">
            <section class="registro-card">
                <header class="registro-header">
                    <h1>Crear cuenta</h1>
                    <p>Completa tus datos para registrarte en Camiones Contratos.</p>
                </header>

                <form id="registroForm" novalidate>
                    <fieldset>
                        <legend>Tipo de usuario</legend>
                        <div class="tipo-grid">
                            <label class="tipo-option">
                                <input type="radio" name="tipo_usuario" value="independiente" checked>
                                <span class="tipo-content"><strong>Usuario independiente</strong>
                                <small>Cuenta para una persona que utiliza el sistema a título personal.</small></span>
                            </label>
                            <label class="tipo-option">
                                <input type="radio" name="tipo_usuario" value="empresa">
                                <span class="tipo-content">
                                    <strong>Usuario empresa</strong>
                                    <small>Cuenta asociada a una empresa u organización.</small>
                                </span>
                            </label>
                        </div>
                    </fieldset>

                    <section class="form-section">
                        <h2>Datos personales</h2>
                        <div class="form-grid">

                            <div class="field">
                                <label for="nombre">Nombre *</label>
                                <input id="nombre" name="nombre" type="text" autocomplete="given-name" required>
                            </div>

                            <div class="field">
                                <label for="apellido">Apellido *</label>
                                <input id="apellido" name="apellido" type="text" autocomplete="family-name" required>
                            </div>

                            <div class="field">
                                <label for="rut_persona">RUT *</label>
                                <input id="rut_persona" name="rut_persona" type="text" placeholder="12.345.678-9" required>
                            </div>

                            <div class="field">
                                <label for="telefono">Teléfono *</label>
                                <input id="telefono" name="telefono" type="tel" placeholder="+56 9 1234 5678" required>
                            </div>

                            <div class="field field-full">
                                <label for="email">Correo electrónico *</label>
                                <input id="email" name="email" type="email" autocomplete="email" required>
                            </div>

                        </div>
                    </section>

                    <section id="empresaSection" class="form-section hidden">

                        <h2>Datos de la empresa</h2>

                        <div class="form-grid">
                            <div class="field field-full">
                                <label for="razon_social">Razón social *</label>
                                <input id="razon_social" name="razon_social" type="text" autocomplete="organization">
                            </div>
                            
                            <div class="field">
                                <label for="rut_empresa">RUT de la empresa *</label>
                                <input id="rut_empresa" name="rut_empresa" type="text" placeholder="76.123.456-7">
                            </div>

                            <div class="field">
                                <label for="giro">Giro / actividad *</label>
                                <input id="giro" name="giro" type="text">
                            </div>

                            <div class="field">
                                <label for="cargo">Cargo del usuario *</label>
                                <input id="cargo" name="cargo" type="text" placeholder="Ej. Administrador">
                            </div>

                            <div class="field">
                                <label for="direccion_empresa">Dirección de la empresa *</label>
                                <input id="direccion_empresa" name="direccion_empresa" type="text" autocomplete="street-address">
                            </div>
                            
                        </div>
                    </section>

                    <section class="form-section">
                        <h2>Seguridad</h2>

                        <div class="form-grid">

                            <div class="field">
                                <label for="password">Contraseña *</label>
                                <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
                                <small class="help">Mínimo 8 caracteres.</small>
                            </div>

                            <div class="field">
                                <label for="confirm_password">Confirmar contraseña *</label>
                                <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
                            </div>

                        </div>

                    </section>

                    <label class="terms">
                        <input id="aceptaTerminos" name="acepta_terminos" type="checkbox" required>
                        <span>Acepto los términos de uso y la política de privacidad.</span>
                    </label>

                    <div id="mensaje" class="mensaje" role="alert" aria-live="polite"></div>

                    <button type="submit" class="btn-primary">Crear cuenta</button>

                </form>
            </section>
        </main>

        <script src="registro.js"></script>

    </body>
</html>
