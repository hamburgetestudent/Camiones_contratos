<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="estilo.css">
    <!-- SDK de EmailJS para envío de correos -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
    <div class="contenedor-recuperar">
        <h2>Recuperar Contraseña</h2>
        <p id="mensaje-estado" class="mensaje oculto"></p>

        <!-- PASO 1: Solicitar correo -->
        <form id="form-correo" class="paso-form">
            <p class="instruccion">Ingresa tu correo electrónico registrado. Te enviaremos un código de validación de 6 dígitos.</p>
            <div class="grupo-input">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
            </div>
            <button type="submit" id="btn-enviar-codigo" class="btn-primario">Enviar Código</button>
        </form>

        <!-- PASO 2: Validar código -->
        <form id="form-codigo" class="paso-form oculto">
            <p class="instruccion">Revisa tu bandeja de entrada (o spam) e ingresa el código enviado a <strong id="correo-mostrado"></strong>.</p>
            <div class="grupo-input">
                <label for="codigo-verificacion">Código de 6 dígitos</label>
                <input type="text" id="codigo-verificacion" maxlength="6" placeholder="123456" required>
            </div>
            <button type="submit" class="btn-primario">Validar Código</button>
            <button type="button" id="btn-reenviar" class="btn-secundario">Volver / Cambiar correo</button>
        </form>

        <!-- PASO 3: Nueva contraseña -->
        <form id="form-nueva-clave" class="paso-form oculto">
            <p class="instruccion">Identidad verificada. Crea tu nueva contraseña.</p>
            <div class="grupo-input">
                <label for="nueva-password">Nueva Contraseña</label>
                <input type="password" id="nueva-password" minlength="6" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div class="grupo-input">
                <label for="confirmar-password">Confirmar Contraseña</label>
                <input type="password" id="confirmar-password" minlength="6" placeholder="Repite la contraseña" required>
            </div>
            <button type="submit" class="btn-primario">Guardar Nueva Contraseña</button>
        </form>

        <div class="enlaces-pie">
            <a href="../Login/index.html">Volver al inicio de sesión</a>
        </div>
    </div>

    <script src="scirpt.js"></script>
</body>
</html>
