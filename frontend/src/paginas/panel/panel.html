<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MansoViaje | Inicio</title>
    <link rel="stylesheet" href="../../compartido/css/tema.css" />
    <link rel="stylesheet" href="panel.css" />
    <script src="../../compartido/js/iconos.js" defer></script>
    <script src="../../compartido/js/sesion.js" defer></script>
    <script src="../../compartido/js/api.js" defer></script>
    <script src="roles.js" defer></script>
    <script src="panel.js" defer></script>
    <script src="vistas/administracion.js" defer></script>
    <script src="vistas/dador.js" defer></script>
    <script src="vistas/transportista.js" defer></script>
  </head>
  <body>
    <div class="barra-movil">
      <div class="marca-movil">
        <span class="mv-isotipo mv-isotipo--sm" id="logo-movil" aria-hidden="true"></span>
        <strong>MansoViaje</strong>
      </div>
      <button id="menu" class="btn-secundario btn-sm" aria-controls="lateral" aria-expanded="false">
        <span id="icono-menu" aria-hidden="true"></span>
        <span>Menú</span>
      </button>
    </div>

    <aside id="lateral">
      <div class="marca-sidebar">
        <span class="mv-isotipo" id="logo-sidebar" aria-hidden="true"></span>
        <div>
          <strong class="marca">MansoViaje</strong>
          <span class="marca-subtitulo">Contratos de carga</span>
        </div>
      </div>

      <nav id="navegacion" aria-label="Navegación principal"></nav>

      <footer>
        <div class="perfil-sidebar">
          <span id="avatar-usuario" class="avatar-sidebar" aria-hidden="true">MV</span>
          <div class="perfil-sidebar-texto">
            <strong id="nombre"></strong>
            <span id="rol"></span>
          </div>
        </div>
        <button id="salir" class="btn-secundario btn-salir" type="button">
          <span id="icono-salir" aria-hidden="true"></span>
          <span>Cerrar sesión</span>
        </button>
      </footer>
    </aside>

    <main>
      <header class="cabecera-panel">
        <div class="cabecera-titulos">
          <h1 id="titulo" tabindex="-1">Inicio</h1>
          <p id="saludo"></p>
        </div>
        <span id="etiqueta" class="etiqueta-rol"></span>
      </header>
      <div id="aviso" role="status" aria-live="polite"></div>
      <section id="contenido" aria-label="Contenido del panel"></section>
    </main>

    <!-- Diálogo de bajas y cancelaciones administrativas con motivo obligatorio -->
    <dialog id="confirmacion" aria-labelledby="titulo-confirmacion">
      <form id="form-baja" class="dialogo-form">
        <h2 id="titulo-confirmacion"></h2>
        <p id="objetivo" class="dialogo-objetivo"></p>
        <p id="efecto-operacion" class="texto-suave"></p>
        <label class="dialogo-campo">
          <span id="etiqueta-motivo">Motivo de la eliminación</span>
          <textarea
            id="motivo"
            required
            rows="3"
            placeholder="Describe brevemente el motivo..."
          ></textarea>
        </label>
        <p id="error-baja" role="alert"></p>
        <div class="botonera">
          <button type="button" id="volver" class="btn-secundario">Volver</button>
          <button id="confirmar-operacion" class="peligro" type="submit">
            Confirmar eliminación
          </button>
        </div>
      </form>
    </dialog>

    <!-- Diálogo reutilizable de confirmación para acciones operativas críticas -->
    <dialog id="confirmacion-accion" aria-labelledby="accion-titulo">
      <div class="dialogo-form">
        <h2 id="accion-titulo">Confirmar acción</h2>
        <p id="accion-descripcion" class="texto-suave"></p>
        <div class="botonera">
          <button type="button" id="accion-cancelar" class="btn-secundario">Cancelar</button>
          <button type="button" id="accion-aceptar" class="btn-primario">Confirmar</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
