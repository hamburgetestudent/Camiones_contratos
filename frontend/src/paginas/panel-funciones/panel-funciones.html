<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Panel de funciones | MansoViaje</title>
    <link rel="stylesheet" href="../../compartido/css/tema.css" />
    <link rel="stylesheet" href="panel-funciones.css" />
  </head>
  <body>
    <main class="contenedor-panel">
      <header class="encabezado">
        <div>
          <p class="sobre-titulo">MANSOVIAJE · CONTRATOS DE CARGA</p>
          <h1>Panel de funciones</h1>
          <p id="saludoUsuario" class="saludo">Bienvenido</p>
        </div>
        <button id="btnCerrarSesion" class="btn-secundario" type="button">Cerrar sesión</button>
      </header>

      <section class="resumen-rol" aria-labelledby="tituloRol">
        <div class="icono-rol" aria-hidden="true">MV</div>
        <div>
          <p class="etiqueta">Tu tipo de cuenta</p>
          <h2 id="tituloRol">Cargando perfil...</h2>
          <p id="descripcionRol">Estamos preparando tus opciones.</p>
        </div>
      </section>

      <section class="seccion-funciones" aria-labelledby="tituloFunciones">
        <div class="titulo-seccion">
          <h2 id="tituloFunciones">¿Qué deseas hacer?</h2>
          <p>Las opciones disponibles dependen del tipo de cuenta.</p>
        </div>
        <div id="listaFunciones" class="rejilla-funciones" aria-live="polite"></div>
      </section>

      <p id="mensajePanel" class="mensaje-panel" role="status" aria-live="polite"></p>
      <footer>MansoViaje · Acceso según tipo de cuenta</footer>
    </main>
    <script src="panel-funciones.js"></script>
  </body>
</html>
