<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Contratos de Camiones</title>
    <!-- Fuente Premium desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="renderer.js"></script>
</head>
<body>
    <header>
        <div class="logo-seccion">
            <div class="indicador-activo"></div>
            <h1>Panel de <span>Monitoreo de Carga</span></h1>
        </div>
        <button id="btn-docs" class="api-docs-btn">Documentación API Swagger</button>
    </header>

    <main>
        <!-- Formulario de Entrada de Contratos -->
        <section class="panel-formulario">
            <h2>Registrar Nuevo Flete</h2>
            <form id="formulario-registro">
                <div class="grupo-entrada">
                    <label for="tipo_material">Tipo de Material</label>
                    <input type="text" id="tipo_material" placeholder="Ej: Cobre, Madera, Cemento" required minlength="2">
                </div>

                <div class="fila-inputs">
                    <div class="grupo-entrada">
                        <label for="cantidad_carga">Peso (Toneladas)</label>
                        <input type="number" id="cantidad_carga" step="0.1" placeholder="Ej: 18.5" required min="0.1">
                    </div>
                    <div class="grupo-entrada">
                        <label for="tarifa_propuesta">Tarifa Propuesta ($)</label>
                        <input type="number" id="tarifa_propuesta" placeholder="Ej: 350000" required min="1">
                    </div>
                </div>

                <div class="grupo-entrada">
                    <label for="origen">Lugar de Retiro (Origen)</label>
                    <input type="text" id="origen" placeholder="Ciudad de retiro" required minlength="3">
                </div>

                <div class="grupo-entrada">
                    <label for="destino">Lugar de Entrega (Destino)</label>
                    <input type="text" id="destino" placeholder="Ciudad de destino" required minlength="3">
                </div>

                <div class="grupo-entrada">
                    <label for="fecha_limite">Fecha Límite</label>
                    <input type="date" id="fecha_limite" required>
                </div>

                <button type="submit" class="btn-registrar">Crear Contrato de Carga</button>
            </form>
        </section>

        <!-- Sección de Estadísticas y Listado de Contratos -->
        <section class="panel-derecho">
            <!-- Tarjetas de Estadísticas superiores -->
            <div class="estadisticas-grid">
                <div class="tarjeta-stat">
                    <span class="titulo">Contratos Activos</span>
                    <span class="valor" id="stat-contratos">0</span>
                </div>
                <div class="tarjeta-stat">
                    <span class="titulo">Carga Total (Ton)</span>
                    <span class="valor" id="stat-toneladas">0.0</span>
                </div>
                <div class="tarjeta-stat">
                    <span class="titulo">Ingresos Estimados</span>
                    <span class="valor" id="stat-tarifas">$0</span>
                </div>
            </div>

            <h2>Listado de Contratos</h2>
            <div id="lista-contratos" class="contenedor-tarjetas">
                <!-- Se carga dinámicamente con JavaScript/TypeScript -->
            </div>
        </section>
    </main>
</body>
</html>
